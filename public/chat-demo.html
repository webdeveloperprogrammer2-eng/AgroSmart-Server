<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgroSmart · Chat &amp; Call</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --text:#16201a; --muted:#68766e;
    --green:#0e9f4a; --green-soft:#e7f6ed; --red:#d1342b; --blue:#2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0a120d; --card:#111c15; --line:#223129; --text:#e8f2ec; --muted:#8ea294;
      --green:#32cf72; --green-soft:#12301f; --red:#ff6b62; --blue:#5b9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .top { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line);
         display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .top h1 { font-size:16px; margin:0; }
  .top .hint { color:var(--muted); font-size:13px; flex:1; min-width:200px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px;
          max-width:1200px; margin:0 auto; align-items:start; }
  @media (max-width:820px) { .wrap { grid-template-columns:1fr; } }

  .pane { background:var(--card); border:1px solid var(--line); border-radius:12px;
          overflow:hidden; display:flex; flex-direction:column; }
  .pane header { padding:12px 14px; border-bottom:1px solid var(--line);
                 display:flex; align-items:center; gap:10px; }
  .pane header h2 { font-size:14px; margin:0; flex:1; }
  .dot { width:8px; height:8px; border-radius:50%; background:#b6c1ba; flex-shrink:0; }
  .dot.on { background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent); }

  .row { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line);
         align-items:center; flex-wrap:wrap; }
  label { font-size:12px; color:var(--muted); }
  input, select { padding:7px 10px; border:1px solid var(--line); border-radius:8px;
                  font:inherit; background:var(--bg); color:var(--text); min-width:0; }
  input[type=number] { width:72px; }
  button { padding:7px 13px; border:0; border-radius:8px; background:var(--green);
           color:#fff; font:inherit; font-weight:650; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.red { background:var(--red); }
  button.blue { background:var(--blue); }
  button:disabled { opacity:.45; cursor:not-allowed; }

  .msgs { height:280px; overflow-y:auto; padding:12px 14px; display:flex;
          flex-direction:column; gap:8px; background:var(--bg); }
  .m { max-width:82%; padding:8px 11px; border-radius:12px; background:var(--card);
       border:1px solid var(--line); font-size:13px; }
  .m.mine { align-self:flex-end; background:var(--green-soft);
            border-color:color-mix(in srgb,var(--green) 30%,transparent); }
  .m .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .m.call { background:transparent; border-style:dashed; color:var(--muted);
            align-self:center; font-size:12px; }
  .m audio { display:block; margin-top:4px; max-width:230px; height:34px; }

  .send { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  .send input { flex:1; }

  .call { padding:10px 14px; border-top:1px solid var(--line); display:flex;
          gap:8px; align-items:center; flex-wrap:wrap; }
  .call .state { font-size:12px; color:var(--muted); flex:1; min-width:120px; }
  .meter { width:70px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--green); transition:width .08s; }

  .log { grid-column:1/-1; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:12px 14px; }
  .log h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em;
            color:var(--muted); margin:0 0 8px; }
  .log pre { margin:0; max-height:190px; overflow:auto; font:12px/1.5 Consolas,monospace;
             color:var(--muted); white-space:pre-wrap; word-break:break-all; }
  .rec { color:var(--red); font-weight:700; }
</style>
</head>
<body>

<div class="top">
  <h1>💬 AgroSmart — чат ва занги аудио</h1>
  <span class="hint">Ду тарафи як сӯҳбат дар як саҳифа. Ҳар кадом пайвастшавии
    WebSocket-и худро дорад — яъне ин ҳамон чизест, ки ду браузери гуногун мекунанд.</span>
  <a href="/docs" style="color:var(--green)">→ Swagger (REST)</a>
</div>

<div class="wrap">
  <div class="pane" id="paneA"></div>
  <div class="pane" id="paneB"></div>

  <div class="log">
    <h2>Рӯйдодҳои WebSocket</h2>
    <pre id="log"></pre>
  </div>
</div>

<template id="paneTpl">
  <header>
    <span class="dot"></span>
    <h2></h2>
    <button class="ghost connect">Пайваст</button>
  </header>

  <div class="row">
    <label>userId</label><input type="number" class="uid" />
    <label>ҳамсӯҳбат</label><input type="number" class="peer" />
    <button class="open" disabled>Сӯҳбат кушодан</button>
    <span class="chatid" style="font-size:12px;color:var(--muted)"></span>
  </div>

  <div class="msgs"></div>

  <div class="send">
    <input class="text" placeholder="Паём нависед…" disabled />
    <button class="sendBtn" disabled>Фиристодан</button>
    <button class="ghost mic" disabled title="Сабти овоз">🎙</button>
  </div>

  <div class="call">
    <button class="blue callBtn" disabled>📞 Занг</button>
    <button class="red hangBtn" disabled>Қатъ</button>
    <span class="state">—</span>
    <span class="meter"><i></i></span>
    <audio class="remote" autoplay></audio>
  </div>
</template>

<script>
const WS_BASE = `ws://${location.host}/ws`;
const logEl = document.getElementById('log');

function log(side, text) {
  const time = new Date().toLocaleTimeString('ru-RU');
  logEl.textContent = `[${time}] ${side}: ${text}\n` + logEl.textContent;
}

// ── Як тарафи сӯҳбат (як корбар) ──────────────────────────────────────
function createPane(root, title, userId, peerId) {
  root.appendChild(document.getElementById('paneTpl').content.cloneNode(true));

  const $ = (s) => root.querySelector(s);
  $('h2').textContent = title;
  $('.uid').value = userId;
  $('.peer').value = peerId;

  const state = {
    ws: null, chatId: null, callId: null, pc: null,
    localStream: null, recorder: null, chunks: [], recStart: 0,
  };

  const me = () => Number($('.uid').value);

  // ── WebSocket ───────────────────────────────────────────────────────
  function connect() {
    if (state.ws) { state.ws.close(); return; }

    const ws = new WebSocket(`${WS_BASE}?userId=${me()}`);
    state.ws = ws;

    ws.onopen = () => {
      $('.dot').classList.add('on');
      $('.connect').textContent = 'Қатъ';
      $('.open').disabled = false;
      log(title, 'WebSocket кушода шуд');
    };

    ws.onclose = () => {
      $('.dot').classList.remove('on');
      $('.connect').textContent = 'Пайваст';
      ['.open', '.text', '.sendBtn', '.mic', '.callBtn', '.hangBtn']
        .forEach((s) => { $(s).disabled = true; });
      state.ws = null;
      log(title, 'WebSocket пӯшида шуд');
    };

    ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  }

  function send(payload) {
    if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify(payload));
  }

  // ── Кушодани сӯҳбат ва таърих ───────────────────────────────────────
  async function openChat() {
    const res = await fetch('/chats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyerId: me(), sellerId: Number($('.peer').value),
        productId: 'demo', productName: 'Демо',
      }),
    });
    const chat = await res.json();
    if (!res.ok) { log(title, 'Хато: ' + chat.error); return; }

    state.chatId = chat.id;
    $('.chatid').textContent = `chatId = ${chat.id}`;
    ['.text', '.sendBtn', '.mic', '.callBtn'].forEach((s) => { $(s).disabled = false; });

    const history = await (await fetch(`/chats/${chat.id}/messages?userId=${me()}`)).json();
    $('.msgs').innerHTML = '';
    history.forEach(addMessage);
    send({ type: 'chat:read', chatId: chat.id });
    log(title, `Сӯҳбат ${chat.id}, таърих: ${history.length} паём`);
  }

  function addMessage(m) {
    const div = document.createElement('div');
    const mine = Number(m.senderId) === me();
    div.className = 'm' + (mine ? ' mine' : '') + (m.kind === 'call' ? ' call' : '');

    if (m.kind === 'call') {
      const label = { ended: 'Занг тамом шуд', missed: 'Занг нарасид',
                      declined: 'Занг рад шуд' }[m.status] || m.status;
      div.textContent = `📞 ${label}${m.duration ? ' · ' + m.duration + 'с' : ''}`;
    } else if (m.kind === 'voice') {
      div.innerHTML = `<div class="who">${mine ? 'Ман' : 'Ҳамсӯҳбат'} · овоз ${m.duration || 0}с</div>`;
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = m.audio;
      div.appendChild(audio);
    } else {
      div.innerHTML = `<div class="who">${mine ? 'Ман' : 'Ҳамсӯҳбат'}</div>`;
      div.appendChild(document.createTextNode(m.text ?? ''));
    }

    $('.msgs').appendChild(div);
    $('.msgs').scrollTop = $('.msgs').scrollHeight;
  }

  // ── Рӯйдодҳо аз сервер ──────────────────────────────────────────────
  async function onEvent(msg) {
    if (msg.type !== 'pong') log(title, '← ' + msg.type);

    if (msg.type === 'chat:message' && msg.chatId === state.chatId) {
      addMessage(msg.message);
      if (Number(msg.message.senderId) !== me()) send({ type: 'chat:read', chatId: state.chatId });
      return;
    }

    if (msg.type === 'call:incoming') {
      state.chatId = msg.chatId;
      state.callId = msg.callId;
      $('.state').textContent = 'Занги воридотӣ…';

      if (!confirm(`${title}: занги воридотӣ. Ҷавоб медиҳед?`)) {
        send({ type: 'call:end', chatId: msg.chatId, callId: msg.callId, reason: 'declined' });
        $('.state').textContent = 'Рад шуд';
        return;
      }

      await ensurePeer();
      await state.pc.setRemoteDescription(msg.sdp);
      const answer = await state.pc.createAnswer();
      await state.pc.setLocalDescription(answer);
      send({ type: 'call:answer', chatId: msg.chatId, callId: msg.callId, sdp: answer });
      $('.hangBtn').disabled = false;
      return;
    }

    if (msg.type === 'call:answer') {
      await state.pc?.setRemoteDescription(msg.sdp);
      return;
    }

    if (msg.type === 'call:ice' && msg.candidate) {
      try { await state.pc?.addIceCandidate(msg.candidate); } catch (e) { log(title, 'ICE: ' + e.message); }
      return;
    }

    if (msg.type === 'call:end') {
      $('.state').textContent = msg.reason === 'offline' ? 'Ҳамсӯҳбат офлайн аст' : 'Занг тамом шуд';
      closePeer();
      return;
    }

    if (msg.type === 'error') log(title, '⚠ ' + msg.error);
  }

  // ── Занги аудио (WebRTC) ────────────────────────────────────────────
  async function ensurePeer() {
    if (state.pc) return;

    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    state.pc = pc;

    state.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.localStream.getTracks().forEach((track) => pc.addTrack(track, state.localStream));

    pc.ontrack = (e) => {
      $('.remote').srcObject = e.streams[0];
      // Дар як саҳифа ду тараф ҳастанд — агар садо бароям, эффекти акс мешавад.
      // Барои ҳамин садо хомӯш аст, вале ҳаракати он дар "meter" дида мешавад.
      $('.remote').muted = true;
      meter(e.streams[0]);
    };

    pc.onicecandidate = (e) => {
      if (e.candidate) send({ type: 'call:ice', chatId: state.chatId, callId: state.callId, candidate: e.candidate });
    };

    pc.onconnectionstatechange = () => {
      $('.state').textContent = 'WebRTC: ' + pc.connectionState;
      log(title, 'WebRTC → ' + pc.connectionState);
    };
  }

  // Сатҳи садо — исботи он ки овоз воқеан мегузарад
  function meter(stream) {
    const ctx = new AudioContext();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);

    (function tick() {
      if (!state.pc) { ctx.close(); $('.meter i').style.width = '0'; return; }
      analyser.getByteFrequencyData(buf);
      const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
      $('.meter i').style.width = Math.min(100, avg * 2.2) + '%';
      requestAnimationFrame(tick);
    })();
  }

  async function startCall() {
    state.callId = 'call-' + Date.now();
    $('.state').textContent = 'Занг зада истодааст…';
    $('.hangBtn').disabled = false;
    state.callStart = Date.now();

    await ensurePeer();
    const offer = await state.pc.createOffer();
    await state.pc.setLocalDescription(offer);
    send({ type: 'call:offer', chatId: state.chatId, callId: state.callId, sdp: offer });
  }

  function hangUp() {
    const duration = state.callStart ? Math.round((Date.now() - state.callStart) / 1000) : 0;
    send({ type: 'call:end', chatId: state.chatId, callId: state.callId, reason: 'ended', duration });
    closePeer();
    $('.state').textContent = 'Занг тамом шуд';
  }

  function closePeer() {
    state.pc?.close();
    state.pc = null;
    state.localStream?.getTracks().forEach((t) => t.stop());
    state.localStream = null;
    state.callStart = null;
    $('.hangBtn').disabled = true;
    $('.meter i').style.width = '0';
  }

  // ── Паёми овозӣ (MediaRecorder) ─────────────────────────────────────
  async function toggleMic() {
    if (state.recorder) {
      state.recorder.stop();
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);
    state.recorder = recorder;
    state.chunks = [];
    state.recStart = Date.now();

    $('.mic').classList.add('rec');
    $('.mic').textContent = '⏹';

    recorder.ondataavailable = (e) => state.chunks.push(e.data);

    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      $('.mic').classList.remove('rec');
      $('.mic').textContent = '🎙';
      state.recorder = null;

      const blob = new Blob(state.chunks, { type: 'audio/webm' });
      const duration = Math.max(1, Math.round((Date.now() - state.recStart) / 1000));

      const reader = new FileReader();
      reader.onload = () => {
        send({ type: 'chat:send', chatId: state.chatId, kind: 'voice',
               audio: reader.result, duration, mimeType: 'audio/webm' });
        log(title, `→ овоз ${duration}с (${(reader.result.length / 1024).toFixed(0)} КБ)`);
      };
      reader.readAsDataURL(blob);
    };

    recorder.start();
  }

  function sendText() {
    const text = $('.text').value.trim();
    if (!text) return;
    send({ type: 'chat:send', chatId: state.chatId, kind: 'text', text });
    $('.text').value = '';
  }

  $('.connect').onclick = connect;
  $('.open').onclick = openChat;
  $('.sendBtn').onclick = sendText;
  $('.text').onkeydown = (e) => { if (e.key === 'Enter') sendText(); };
  $('.mic').onclick = toggleMic;
  $('.callBtn').onclick = startCall;
  $('.hangBtn').onclick = hangUp;
}

createPane(document.getElementById('paneA'), 'Харидор', 3, 5);
createPane(document.getElementById('paneB'), 'Фурӯшанда', 5, 3);
</script>
</body>
</html>
